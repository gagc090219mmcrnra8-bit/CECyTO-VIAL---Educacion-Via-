<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CECyTO Vial | Galería</title>

<style>
:root{
  --azul:#007FFF;
  --marino:#00308F;
  --oscuro:#102A43;
  --turquesa:#40E0D0;
  --fondo:#F1F7FC;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--fondo);
  color:#203040;
  line-height:1.6;
}

header{
  background:var(--oscuro);
  color:white;
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

/* LOGO */
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:bold;
  color:white;
  text-decoration:none;
}

.logo img{
  width:53px;
  height:53px;
  object-fit:contain;
  border-radius:50%;
  background:white;
}

.logo-texto span{
  color:var(--turquesa);
}

nav{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

nav a{
  color:white;
  text-decoration:none;
  padding:8px;
  border-radius:7px;
}

nav a:hover{
  background:#ffffff25;
}

main{
  max-width:1150px;
  margin:auto;
  padding:35px 20px;
}

h1,h2,h3{
  color:var(--marino);
}

.hero{
  padding:30px;
  background:linear-gradient(120deg,#00308F,#007FFF);
  border-radius:16px;
  color:white;
  margin-bottom:25px;
}

.hero h1{
  color:white;
  font-size:clamp(30px,5vw,43px);
}

.barra{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:20px 0;
}

input[type=search]{
  flex:1;
  min-width:180px;
  padding:12px;
  border:1px solid #b9cbd8;
  border-radius:8px;
  font-size:16px;
}

select{
  padding:12px;
  border:1px solid #b9cbd8;
  border-radius:8px;
  background:white;
  font-size:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}

.item{
  background:white;
  border:1px solid #d8e6f0;
  border-radius:13px;
  overflow:hidden;
  box-shadow:0 5px 15px #00308f0b;
}

.item img{
  display:block;
  width:100%;
  height:220px;
  object-fit:cover;
  background:#dceeff;
  cursor:zoom-in;
}

.item-contenido{
  padding:15px;
}

.item h3{
  margin-bottom:5px;
}

.item p{
  font-size:14px;
}

button{
  background:var(--marino);
  color:white;
  border:0;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:var(--azul);
}

.vacio{
  padding:20px;
  background:white;
  border-radius:10px;
}

.modal{
  position:fixed;
  inset:0;
  background:#071525ed;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.abierto{
  display:flex;
}

.modal-contenido{
  width:min(900px,100%);
  text-align:center;
  color:white;
}

.modal img{
  max-width:100%;
  max-height:70vh;
  object-fit:contain;
  border-radius:10px;
}

.modal h2{
  color:white;
  margin:10px;
}

.cerrar{
  background:var(--turquesa);
  color:var(--oscuro);
  font-weight:bold;
  margin-bottom:12px;
}

footer{
  text-align:center;
  background:var(--oscuro);
  color:white;
  padding:25px;
}

footer a{
  color:var(--turquesa);
}

@media(max-width:600px){
  header{justify-content:center}
  .logo{justify-content:center}
  nav{justify-content:center}
  main{padding:25px 14px}
  .item img{height:190px}
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">
    <img src="logo cecyto.jpeg" alt="Logo de CECyTO Vial">
    <span class="logo-texto">CECyTO <span>Vial</span></span>
  </a>

  <nav aria-label="Menú principal">
    <a href="index.html">Inicio</a>
    <a href="senales.html">Señales</a>
    <a href="reglamento.html">Reglamento</a>
    <a href="infracciones.html">Infracciones</a>
    <a href="galeria.html">Galería</a>
    <a href="cuestionario.html">Cuestionario</a>
    <a href="contacto.html">Contacto</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1>Galería multimedia</h1>
    <p>Fotografías, señales, actividades escolares y materiales de educación vial.</p>
  </section>

  <div class="barra">
    <input type="search" id="buscar"
      placeholder="Buscar en la galería..."
      aria-label="Buscar imágenes">

    <select id="categoria" aria-label="Filtrar por categoría">
      <option value="Todas">Todas las categorías</option>
      <option value="Señales">Señales</option>
      <option value="Seguridad">Seguridad vial</option>
      <option value="Escuela">Actividades escolares</option>
    </select>
  </div>

  <p id="contador" aria-live="polite"></p>
  <section id="galeria" class="grid"></section>
</main>

<div class="modal" id="modal" role="dialog"
  aria-modal="true" aria-labelledby="tituloModal">

  <div class="modal-contenido">
    <button class="cerrar" id="cerrar" type="button">
      ✕ Cerrar imagen
    </button>

    <img id="imagenGrande" src="" alt="">
    <h2 id="tituloModal"></h2>
    <p id="descripcionGrande"></p>
  </div>
</div>

<footer>
  <p><strong>CECyTO Vial</strong> · Galería educativa</p>
  <p><a href="index.html">Volver al inicio</a></p>
</footer>

<script>
const imagenes=[
  {
    titulo:"Señal de ALTO",
    categoria:"Señales",
    archivo:"alto.jpeg",
    descripcion:"Ejemplo de señal restrictiva."
  },
  {
    titulo:"Señales preventivas",
    categoria:"Señales",
    archivo:"preventiva.jpeg",
    descripcion:"Material visual para reconocer advertencias viales."
  },
  {
    titulo:"Seguridad en el vehículo",
    categoria:"Seguridad",
    archivo:"vial.jpeg",
    descripcion:"Ejemplo de prácticas de prevención."
  },
  {
    titulo:"Uso del casco",
    categoria:"Seguridad",
    archivo:"casco.jpeg",
    descripcion:"La protección personal es fundamental."
  },
  {
    titulo:"Actividad escolar",
    categoria:"Escuela",
    archivo:"lulu.jpeg",
    descripcion:"Fotografías de las actividades del proyecto."
  },
  {
    titulo:"Proyecto CECyTO Vial",
    categoria:"Escuela",
    archivo:"pio.png",
    descripcion:"Material de presentación del proyecto."
  }
];

const galeria=document.getElementById("galeria");
const modal=document.getElementById("modal");

function escapar(texto){
  return String(texto).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function dibujar(){
  const texto=document.getElementById("buscar")
    .value.toLowerCase().trim();

  const cat=document.getElementById("categoria").value;

  const resultados=imagenes.filter(i=>
    (cat==="Todas" || i.categoria===cat) &&
    (i.titulo+" "+i.categoria+" "+i.descripcion)
      .toLowerCase().includes(texto)
  );

  document.getElementById("contador").textContent=
    resultados.length+" imagen(es) en la galería.";

  if(!resultados.length){
    galeria.innerHTML=
      '<p class="vacio">No hay imágenes que coincidan con tu búsqueda.</p>';
    return;
  }

  galeria.innerHTML=resultados.map(i=>`
    <article class="item">
      <img
        src="${escapar(i.archivo)}"
        alt="${escapar(i.titulo)}"
        loading="lazy"
        data-indice="${imagenes.indexOf(i)}"
        onerror="this.onerror=null;this.style.display='none'">

      <div class="item-contenido">
        <h3>${escapar(i.titulo)}</h3>
        <p>${escapar(i.descripcion)}</p>
        <p><strong>${escapar(i.categoria)}</strong></p>
        <button type="button"
          data-abrir="${imagenes.indexOf(i)}">
          Ampliar imagen
        </button>
      </div>
    </article>
  `).join("");

  galeria.querySelectorAll("[data-abrir]").forEach(b=>{
    b.addEventListener("click",()=>{
      abrir(Number(b.dataset.abrir));
    });
  });

  galeria.querySelectorAll("img[data-indice]").forEach(img=>{
    img.addEventListener("click",()=>{
      abrir(Number(img.dataset.indice));
    });
  });
}

function abrir(indice){
  const i=imagenes[indice];
  if(!i)return;

  document.getElementById("imagenGrande").src=i.archivo;
  document.getElementById("imagenGrande").alt=i.titulo;
  document.getElementById("tituloModal").textContent=i.titulo;
  document.getElementById("descripcionGrande").textContent=i.descripcion;

  modal.classList.add("abierto");
  document.getElementById("cerrar").focus();
}

function cerrar(){
  modal.classList.remove("abierto");
  document.getElementById("imagenGrande").src="";
}

document.getElementById("cerrar")
  .addEventListener("click",cerrar);

modal.addEventListener("click",e=>{
  if(e.target===modal)cerrar();
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape")cerrar();
});

document.getElementById("buscar")
  .addEventListener("input",dibujar);

document.getElementById("categoria")
  .addEventListener("change",dibujar);

dibujar();
</script>

</body>
</html>
